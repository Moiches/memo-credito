entorno: prod

llm:
  modo: bedrock
  permitir_override_modo: false

infra:
  vpc: true                                # interface endpoints: bedrock-runtime, states, xray; gateway: s3, dynamodb
  concurrencia_reservada_redaccion: 5      # requiere la cuota de concurrencia de Lambda en 1,000
  map_max_concurrency: 10
  revision_sla_s: 86400
  max_escalamientos: 3
  retencion_logs_dias: 180
  auditoria_modo: COMPLIANCE
  auditoria_dias: 3650                     # supuesto de PLD (10 años); validar con Cumplimiento
  ciclo_vida_entrada_dias: 90
  ciclo_vida_trabajo_dias: 365
  destruir_al_borrar: false
  crear_perfil_aplicacion: true
  data_protection_logs: true
  costos:
    umbral_memo_usd: "0.10"
    umbral_hora_usd: "5"
    presupuesto_mes_usd: "500"
  suscriptores_alarmas: []
