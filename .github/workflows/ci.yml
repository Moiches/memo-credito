# Pull requests: calidad e infraestructura son checks obligatorios en la protección de rama.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"

jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Dependencias exactas del lockfile
        run: |
          uv lock --check
          uv sync --frozen
      - name: Lint y tipos
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Pruebas (unitarias, regresión, adversariales, arquitectura, handlers)
        run: uv run pytest --ignore=tests/infra
      - name: Evals deterministas y candado de prompt/modelo
        run: |
          uv run memo evals --modo simulado
          uv run memo evals --verificar-candado
      - name: Diagrama del grafo actualizado
        run: uv run memo diagrama --verificar
      - name: Vulnerabilidades conocidas en dependencias de ejecución
        run: |
          uv export --frozen --no-default-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --require-hashes --disable-pip -r "$RUNNER_TEMP/req.txt"
      - name: Secretos (gitleaks, misma versión que pre-commit)
        run: uv run pre-commit run gitleaks --all-files

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: |
          uv sync --frozen
          npm ci
      - name: Pruebas de infraestructura (cdk-nag, inventario de permisos, recursos)
        run: uv run pytest tests/infra
      - name: Paquete de Lambda y synth de dev y prod con cdk-nag
        run: |
          uv run python scripts/build_lambda.py
          npx cdk synth -c entorno=dev --quiet
          npx cdk synth -c entorno=prod --quiet

  diff:
    # Solo PRs del mismo repositorio: los forks no reciben credenciales.
    # Dependabot no recibe token OIDC ni secretos: su PR solo pasa por calidad e infra.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.ROL_PR_LECTURA }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: cdk diff contra dev
        continue-on-error: true
        run: |
          uv sync --frozen && npm ci
          uv run python scripts/build_lambda.py
          # El comentario del PR es público y GitHub no enmascara lo que se publica por API: se quita la cuenta.
          CUENTA=$(aws sts get-caller-identity --query Account --output text)
          npx cdk diff "MemoCredito-dev/*" -c entorno=dev --no-change-set 2>&1 | sed "s/$CUENTA/<cuenta>/g" > "$RUNNER_TEMP/diff.txt" || true
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync(`${process.env.RUNNER_TEMP}/diff.txt`, 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: '### cdk diff (dev)\n```\n' + diff + '\n```',
            });
